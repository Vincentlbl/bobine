# DÉPLOIEMENT : les mêmes conteneurs, en version "production".
#
#   cp .env.example .env    (avec de VRAIS secrets)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Seul le port du site est ouvert vers l'extérieur. Nginx sert le front
# compilé et fait suivre /api vers l'API ; MongoDB et l'API restent privés.

name: bobine-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host $$(hostname) --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  api:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      MONGODB_URI: mongodb://bobine_app:${APP_DB_PASSWORD}@mongo:27017/bobine
      CATALOG_MONGODB_URI: mongodb://catalog_reader:${CATALOG_DB_PASSWORD}@mongo:27017/sample_mflix
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  mongo-data:
