# Intégration continue : à chaque push, GitHub vérifie que le projet est sain.
# C'est la première brique d'une chaîne CI/CD : si une étape échoue,
# on ne fusionne pas (et on ne déploie pas).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    # Un MongoDB jetable, démarré uniquement pour la durée des tests.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      JWT_SECRET: secret-utilise-uniquement-par-la-ci
      MONGODB_URI_TEST: mongodb://localhost:27017/bobine_test
      CATALOG_MONGODB_URI_TEST: mongodb://localhost:27017/catalog_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Front (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
