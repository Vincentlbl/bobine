# Configuration Nginx du conteneur "web" en production.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Tout ce qui commence par /api part vers le conteneur de l'API.
  # Pour le navigateur, front et API ont la même origine : pas de CORS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fichiers compilés par Vite : leur nom contient une empreinte, on peut
  # donc les garder longtemps en cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Application React à page unique : toute autre adresse (/journal,
  # /films/123...) renvoie index.html, et React Router affiche la bonne page.
  location / {
    try_files $uri /index.html;
  }
}
